path: ""
defaultUsername: "admin"
deterministicPassword: true
releaseNotes: >-
  Version 0.1.1 keeps app id routehash-gateway, so the data from 0.1.0 stays.
  It installs on umbrelOS 1.x and umbrelOS 2.0. This app pulls a pinned image
  and does not build on the Umbrel. The start script now writes the Knots RPC
  address as an http URL. The home-screen stats widget is gone because this
  image has no Umbrel widget endpoint. Miner port 23339. Pool Host stays
  pool.routehash.com:28915. Independent operators clear Pool Host.
submitter: RouteHash
submission: https://app.routehash.com/pool/connect
