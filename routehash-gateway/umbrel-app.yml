manifestVersion: 1.1
id: routehash-gateway
category: bitcoin
name: RouteHash Datum Gateway
version: "0.1.1"
tagline: Your ASICs and your Knots, pointed at RouteHash
description: >-
  ⚙️ Please read the important setup instructions at the bottom of this page.


  This listing is version 0.1.1. It installs on umbrelOS 1.x and umbrelOS 2.0.
  It is the same app as 0.1.0, so an update keeps the saved gateway config.
  Beta until a live Umbrel install is confirmed. Umbrel opens the tile on port
  7154 and forwards it to the API on port 7152. Another app on this Umbrel
  reaches that API at http://10.21.21.71:7152.


  Already run Bitcoin Knots on Umbrel? This installs DATUM next to it so you can
  join RouteHash as a segment. ASICs stay on this gateway’s miner port (23339).
  Never put 28915 on the ASIC.


  Pool Host is prefilled `pool.routehash.com:28915`. Independent operators leave
  Pool Host blank after install, or skip this app. Hash-only miners skip this
  app; firmware stays `stratum.routehash.com:23335`.


  This app does not ship Knots. It depends on the official Umbrel app id
  `bitcoin-knots`. That listing is version 1.2.13, Knots v29.4.knots20260508.
  It follows Bitcoin and does not include Blake2b, so a Blake2b ASIC does not
  get Blake2b work from it. Leave that app in place when Lightning or Electrs
  uses it. This gateway does not attach to Knots (BLAKE2b) Companion. If you
  already run Datum (BLAKE2b) Companion on Paul’s Knots, skip this app. Paste
  Pool Host `pool.routehash.com`, Port `28915`, and the pubkey from
  https://app.routehash.com/pool/connect into that companion.


  🛠️ SET-UP INSTRUCTIONS


  ### Bitcoin Knots


  Install **Bitcoin Knots** from the official App Store first and let it finish
  sync. This app connects to that app automatically. A full archival node is not
  required for mining. Blake2b work needs a Knots build that advertises the
  Blake2b rule. The official 1.2.13 app does not.


  ### Configuring the gateway


  Open this app. Set your Mining Bitcoin Address under the **Config** tab before
  hashing. Credentials: right-click the app icon → Show default credentials.
  Username is `admin`.


  Confirm Pool Host `pool.routehash.com`, Pool Port `28915`, Pool Pubkey filled,
  Collaborative reward sharing = prefer, Pool Pass User = On, Pool Pass Workers
  = Off.


  Independent / solo: clear Pool Host.


  ### Connecting your miner


  In the miner’s own web interface, set the pool to your server’s IP on port
  23339:


    - Stratum URL: `stratum+tcp://<this Umbrel's LAN address>:23339`

    - Username/Worker: `youraddress.workername`

    - Password: leave blank, or `d=2048` if the miner requires a password


  **Use your server’s IP address, not a .local name.** Most ASIC firmware has no
  mDNS resolver.


  Port 23339 is used so this app can sit beside official DATUM (23334) and Paul’s
  companions (23336 / 23338).
developer: RouteHash
