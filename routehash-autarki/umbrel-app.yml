id: routehash-autarki
category: bitcoin
name: Autarki - Wallet / Nostr Shop
version: "0.1.3"
tagline: No platform. Just the sale.
description: >-
  This listing installs on umbrelOS 1.x and umbrelOS 2.0. Autarki is one wallet and one shop on this server. The first screen creates the wallet. Write the 24 words on paper before you leave that screen. A password for this copy is optional. If you leave it blank, the 24 words stay in the clear, and a backup of this app is then the seed.


  Ordinary XBT and SHA-256d addresses use Autarki's servers until you connect your own node under Settings, then Coin Nodes. Until then the page gives a normal address. A silent-payment code needs your own node. XBTC uses Autarki's public node until you connect your own under Settings, then Coin Nodes. The StartOS package and the Umbrel package do not include that node.


  Install does not require Bitcoin Knots or Bitcoin Core. Umbrel's Bitcoin app is Bitcoin Core, so this package does not use it as the XBT node.
releaseNotes: >-
  Version 0.1.3 keeps this app id, so a wallet from 0.1.2 stays. Umbrel builds the program on the machine. Umbrel Home, Umbrel Pro, and an AMD or Intel Umbrel use the amd64 program. A Raspberry Pi uses the arm64 program.
