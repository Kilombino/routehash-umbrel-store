manifestVersion: 1.1
id: routehash-autarki
category: bitcoin
name: Autarki - Wallet / Nostr Shop
version: "0.1.10"
tagline: No platform. Just the sale.
description: >-
  This listing installs on umbrelOS 1.x and umbrelOS 2.0. Autarki is one wallet and one shop on this server. The first screen creates the wallet. Write the 24 words on paper before you leave that screen. A password for this copy is optional. If you leave it blank, the 24 words stay in the clear, and a backup of this app is then the seed.


  The page is Shop, Receive, Send, Balance, Ledger, Store, Mining, Classifieds, and Settings. Settings is the gear on the first row. Classifieds stays hidden until you turn on Enable Classifieds. A draft stays on this computer. The categories are Goods, Services, Jobs, Rentals, Giveaways, and Personals. Classifieds use their own node list. An ad can carry up to four image addresses and a map link. Use my location copies the shop's saved place. Search sits to the left of the keyword. Post and Check for orders are icons beside Show Ignored and View blocked. Opening Post hides the ads. A classified ad and a store listing use the same Nostr account. Each connected coin node gets a silent-payment code. The buyer pay card names the chain in the center. A price line reads Price in sats, then an approximate dollar amount, then now at market price. The word price opens the Neoxa market for BTCB2/USDC. A name on a post or an order is the display name that person published, or their name when they published no display name. A click copies the public name. A missing profile stays the short public name. That name is what they wrote. Kind 0 is a profile. A whitelist that should show a name also allows kind 0. If Shop or Classifieds comes back empty, check the Nostr node. If it allows every kind, leave it that way. If it only allows some kinds, allow 30402, 30017, 30018, 10050, and 1059. Mining stays hidden until you save a RouteHash account under Settings. Open Mining Invoices on Balance follows that account. At the counter, Pay Counter and the clerk ticket stay on the page. An online shop asks Ship or Pick up, with no default. Pick up pays the shop the same way as the counter. A shipment pays with Lightning. The shop marks it shipped. The customer marks it received. The shop's node holds the coins until then. If the customer does not mark it received, the hold ends and the coins return to the customer. The shop's node has to stay on for that window. Each open order shows Ordered by and a short public name.


  Hire a listed Blake2b rig with XBT, or a listed SHA-256 rig with BTC. Mine writes a Lightning invoice for accepted shares and waits until you click Pay. Paying it starts that rig only. The button says Pay to start on the first invoice, and Pay to keep when that rig is already hashing. Add Hash puts another rig on the same card. Hours from balance uses the confirmed balance for the rig's minimum time. The first click quotes the hire. The second click spends it. Nothing is spent until you click Mine or confirm those hours. The card shows the work still paid for, and counts down while the rig is hashing.


  Ordinary XBT and SHA-256d addresses use Autarki's servers until you connect your own node under Settings, then Coin Nodes. Until then the page gives a normal address. Paying a shop order uses that stall's silent-payment code from that order. A code you type on Send uses your own node. XBTC uses Autarki's public node until you connect your own under Settings, then Coin Nodes. The StartOS package and the Umbrel package do not include that node. Receive, Send, Balance, and the till label ordinary Bitcoin as BTC. Remove this node, under Settings, then Coin Nodes, hides that chain until you press Use this node. The choice stays in this browser. Blake2b Lightning and SHA-256 Lightning are your own nodes. The seed stays in this wallet. The longer notes on those cards stay closed until you open them.


  Install does not require Bitcoin Knots or Bitcoin Core. On Umbrel you can run Knots for XBT, Knots for XBTC, or Bitcoin Core for SHA-256. XBT Knots and Bitcoin Core do not run on the same computer. XBTC Knots can run on the same computer as XBT Knots. This package does not treat Bitcoin Core as the XBT node. Blake2b Lightning is Lightning Fork, which PaulsCode made for XBT Knots. SHA-256 Lightning is LND, for Bitcoin Core. A giveaway, a personal, or a job you are hiring for can be posted with no coin node. A store catalog can be saved and announced too. Goods, a service, a rental, or a job offered for a price needs the XBT node or the Bitcoin node. One is enough. Buyers pay that shop on-chain after a coin node is connected and you publish the shop again.
releaseNotes: >-
  Version 0.1.10 keeps this app id, so a wallet from 0.1.9 stays. This listing installs on umbrelOS 1.x and umbrelOS 2.0. If the store still shows 0.1.9, remove this community store and add https://github.com/RouteHash-com/umbrel-store again. Edit on a catalog product opens the form on that product and brings it into view. Classifieds puts Search to the left of the keyword. Post and Check for orders are icons on the same row as Show Ignored and View blocked. Opening Post hides the ads, your ads, and the order notice. A classified ad and a store listing are saved to the same Nostr account on the relay(s); they use the same key. Publishing an ad does not require a store listing. Place notes sit on the Country row. Each connected coin node gets a silent-payment code, so a buyer can pay that chain. The buyer pay card uses the same code picture as a shop order, with the chain name in the center. Coin Nodes explains what a coin node is, where to install it, and what Lightning is. The long notes stay closed until you open them. On Umbrel you can run Knots for XBT, Knots for XBTC, or Bitcoin Core for SHA-256. XBT Knots and Bitcoin Core do not run on the same computer. XBTC Knots can run on the same computer as XBT Knots. Blake2b Lightning is Lightning Fork, which PaulsCode made for XBT Knots. SHA-256 Lightning is LND, for Bitcoin Core. A giveaway, a personal, or a job you are hiring for can be posted with no coin node. A store catalog can be saved and announced too. Goods, a service, a rental, or a job offered for a price needs the XBT node or the Bitcoin node. One is enough. That ad can carry a payment code for each connected node. Buyers pay that shop on-chain after a coin node is connected and you publish the shop again. Classifieds stay hidden until Enable Classifieds is on. Drafts stay on this computer. A name on a post is the name that person published, and a click copies the public name. A whitelist that should show a name also allows kind 0. Settings is the gear. If Shop or Classifieds comes back empty, allow every kind, or allow 30402, 30017, 30018, 10050, and 1059. A classified price line says now at market price, and the word price opens the Neoxa BTCB2/USDC market.


  Receive, Send, Balance, and the till label ordinary Bitcoin as BTC. Under Settings, then SHA-256 Lightning, the save button says Save BTC Lightning. Remove this node, under Settings, then Coin Nodes, hides that chain on Receive, Send, Balance, checkout, Check Outs, and the till. Use this node brings the chain back. The choice stays in this browser. A saved connection stays on this computer.


  Mining stays hidden until a RouteHash account is saved. Hire a listed Blake2b rig with XBT, or a listed SHA-256 rig with BTC. Mine writes a Lightning invoice for accepted shares and waits until Pay. Paying it starts that rig only. Hours from balance spends the confirmed balance for the rig's minimum time, after a second confirmation. Add Hash, Pay to start, and Pay to keep are on the card. Open Mining Invoices on Balance follows the same account.


  An online shop asks Ship or Pick up, with no default. A shipment pays with Lightning. The shop marks it shipped. The customer marks it received. The shop's node holds the coins until then. If the customer does not mark it received, the hold ends and the coins return to the customer. On a customer wallet, the open order stays on Shop.


  A PC, Umbrel Home, and Umbrel Pro use the amd64 program. A Raspberry Pi uses the arm64 program.
