releaseNotes: >-
  Version 0.1.5 runs the container as user 1000:1000 instead of root, like
  Autarki and RouteHash Gateway. On start, the data saved by 0.1.4 and
  earlier is handed to that user, so it stays writable. The saved chooser
  stays, and chooser.json keeps mode 600. App id, port 7156 and settings are
  unchanged.
