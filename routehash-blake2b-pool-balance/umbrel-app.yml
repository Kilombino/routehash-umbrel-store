manifestVersion: 1.1
id: routehash-blake2b-pool-balance
category: bitcoin
name: Blake2b Pool Balance
version: "0.1.5"
tagline: Keeps one Blake2b pool from growing past the share you will help it hold
description: >-
  Beta. A live Umbrel install is not confirmed yet. This listing is version 0.1.5. It installs on umbrelOS 1.x and umbrelOS 2.0. An update keeps the saved chooser. Umbrel builds it on the machine. A Raspberry Pi builds the arm64 image. Umbrel Home and Umbrel Pro are Intel and build the amd64 image.


  Already run a DATUM gateway on this Umbrel? This sits beside it. It does not
  install DATUM and it does not replace RouteHash Gateway. ASICs stay on that
  gateway's miner port. RouteHash Gateway uses 23339. This app has no miner
  port. Never put 28915 on an ASIC.


  Pick Node Runner or Pool Operator. A node runner completes only the local
  DATUM form. A pool operator only lists a pool. Do not opt in the DATUM that
  is the pool. That would send every miner on that pool to some other pool.
  Personal mining uses a second DATUM.


  Opt in before Pool Host can move. Local max percent is your limit, not the
  pool cap. An empty local max percent stores 30 on this machine. A blank home
  Pool Host is copied from your DATUM gateway on the next pass. The relay list starts with
  wss://relay.routehash.com. Add your own relay on the next line. On this Umbrel,
  install Nostr Relay from the App Store under Social and paste the relay URL
  it shows. On a LAN that URL is often ws:// and port 4848. This list does not
  grow by itself. A wss URL needs a certificate for that name. A Start9 trusts
  its own certificate on the LAN. Turn Public on for StartTunnel, or forward
  the nostr port on your router. A Nostr client reads a relay. This list stores
  the relay address. Kinds 30080 and 30081 must stay allowed.


  House Pool is the last stop and is already filled in. The host is
  pool.routehash.com and the port is 28915. Clear it if you do not want that
  fallback. After 30 minutes on House Pool, this app stays there until your
  home Pool Host fits again.


  Open the app before a rig can move. On the gateway service open Web
  Interface. Paste one Local https address. On Umbrel, when the gateway is
  RouteHash Gateway on this machine, that address is http://10.21.21.71:7152.
  The Listen Port on the API screen is the port inside the gateway. Paste the
  Admin Password from that API screen. Turn on Allow API Config Writes on that
  same API screen. This app cannot turn that switch on. The dashboard user is
  admin. A blank address on this page keeps the address already saved.


  Skip publish if you only run a DATUM gateway. The 320-character private key
  proves you own the pool. On StartOS it is the file ratum-prime.key in the
  RATUM Prime service data. That service writes the file the first time it
  starts and does not show it. Show Pool Pubkey cannot sign a cap. A DATUM
  gateway does not have this file. The cap is sent first. The listing is sent
  only after a relay accepts that cap. A listing with no cap does not move
  anyone. While this app is running it re-signs the last accepted publish after
  12 hours. A removal is not renewed. If the app is off, publish again within
  24 hours.


  XBT pool size comes from mempool.guide. XBTC pool size comes from
  mempool.xbtcash.org. estimatedHashrate is the pool TH/s when that field is
  present. The table shows Pool TH/s. Chain this node is on starts on XBT.
  Pick XBTC when the RPC is the XBTC Knots node. When the Node RPC address is
  set, getnetworkhashps replaces the explorer total for that chain. The other
  chain uses its explorer. When the address is blank, each chain uses its
  explorer. Without a chain sample for a tag, another pool is not an overflow
  target.


  Hashers who do not run a node skip this app.
